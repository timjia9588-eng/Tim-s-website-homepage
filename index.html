<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Jia | Systems & Networks</title>

    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json" as="fetch" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; background-color: #222222; overflow: hidden; font-family: 'Roboto Mono', monospace; }
        canvas { display: block; }

        .ui-overlay { position: absolute; top: 40px; left: 40px; color: rgba(255, 255, 255, 0.7); z-index: 10; pointer-events: none; }
        .title { font-size: 1.2rem; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 10px; }
        .tagline { font-size: 0.7rem; opacity: 0.5; letter-spacing: 0.1em; }

        .alt-version-link {
            position: absolute; bottom: 40px; left: 40px; color: rgba(255, 255, 255, 0.4);
            font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase;
            text-decoration: none; z-index: 10; transition: color 0.4s ease; pointer-events: auto;
        }
        .alt-version-link:hover { color: rgba(255, 255, 255, 0.95); }

        .marker-label {
            color: #fff; font-family: 'Roboto Mono', monospace; font-size: 10px; letter-spacing: 0.1em;
            pointer-events: auto; background: rgba(0, 0, 0, 0.72); padding: 4px 8px;
            border-left: 2px solid rgba(255, 255, 255, 0.85); white-space: nowrap;
            text-transform: uppercase; cursor: pointer;
            transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), background 0.45s ease, color 0.45s ease, border-left 0.45s ease;
            transform-origin: left center; will-change: transform;
        }

        .marker-label:hover {
            background: rgba(255, 255, 255, 0.95); color: #000;
            transform: translate3d(10px, 0, 0) scale(1.12); border-left: 4px solid #fff; z-index: 100;
        }

        .marker-label.marker-label--menu {
            position: relative;
            display: inline-flex;
            flex-direction: row;
            align-items: center;
            z-index: 120;
        }
        .marker-label.marker-label--menu:hover { z-index: 250; }
        .marker-inline-menu {
            position: absolute;
            left: calc(100% + 10px);
            top: 50%;
            transform: translateY(-50%);
            display: none;
            flex-direction: column;
            gap: 6px;
            min-width: 220px;
            max-width: min(320px, 42vw);
            padding: 8px;
            background: rgba(10, 10, 10, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-left: 3px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
            pointer-events: auto;
        }
        .marker-inline-menu.is-open { display: flex; }
        .marker-inline-menu-btn {
            font-family: 'Roboto Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.07em;
            line-height: 1.35;
            text-transform: uppercase;
            text-align: left;
            cursor: pointer;
            width: 100%;
            padding: 10px 10px;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-left: 2px solid rgba(255, 255, 255, 0.45);
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .marker-inline-menu-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            border-left-color: #fff;
            transform: translateX(3px);
        }

        .project-panel {
            position: absolute; top: 0; right: 0; width: 450px; height: 100vh;
            background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255, 255, 255, 0.1); color: #fff;
            padding: 60px 40px; box-sizing: border-box;
            transform: translateX(100%); transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200; overflow-y: auto; display: flex; flex-direction: column;
        }

        .project-panel.active { transform: translateX(0); }

        .close-btn { align-self: flex-start; color: rgba(255, 255, 255, 0.5); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; margin-bottom: 40px; transition: color 0.3s; }
        .close-btn:hover { color: #fff; }

        .proj-title { font-size: 1.5rem; letter-spacing: 0.1em; margin-bottom: 20px; font-weight: 400; text-transform: uppercase; }
        .proj-meta { font-size: 0.7rem; line-height: 1.6; color: rgba(255, 255, 255, 0.6); margin-bottom: 40px; padding-left: 15px; border-left: 1px solid rgba(255, 255, 255, 0.3); }
        .proj-desc { font-size: 0.8rem; line-height: 1.8; color: rgba(255, 255, 255, 0.8); text-align: justify; margin-bottom: 30px; }

        .proj-image {
            width: 100%;
            height: auto;
            margin-bottom: 30px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .proj-image:hover {
            transform: scale(1.03); 
        }

        /* 悬停项目图时，在左侧地球区域展示边缘略渐隐的预览 */
        .globe-image-preview {
            position: fixed;
            left: 0;
            top: 0;
            width: min(780px, 64vw);
            height: 100vh;
            z-index: 15;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8vh 2vw 8vh 4vw;
            box-sizing: border-box;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .globe-image-preview.is-visible {
            opacity: 1;
            visibility: visible;
        }
        .globe-image-preview__inner {
            position: relative;
            max-width: 100%;
            max-height: 78vh;
            -webkit-mask-image: radial-gradient(
                ellipse 78% 74% at 50% 50%,
                #000 0%,
                #000 72%,
                rgba(0, 0, 0, 0.88) 82%,
                rgba(0, 0, 0, 0.35) 93%,
                transparent 100%
            );
            mask-image: radial-gradient(
                ellipse 78% 74% at 50% 50%,
                #000 0%,
                #000 72%,
                rgba(0, 0, 0, 0.88) 82%,
                rgba(0, 0, 0, 0.35) 93%,
                transparent 100%
            );
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }
        .globe-image-preview__inner img {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 78vh;
            object-fit: contain;
            filter: drop-shadow(0 28px 48px rgba(0, 0, 0, 0.55));
        }

        .project-panel::-webkit-scrollbar { width: 4px; }
        .project-panel::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); }

        .globe-renderer,
        .globe-labels,
        .ui-overlay,
        .alt-version-link {
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        body.pig-party-active .globe-renderer,
        body.pig-party-active .globe-labels,
        body.pig-party-active .ui-overlay,
        body.pig-party-active .alt-version-link {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .pig-party {
            position: fixed;
            inset: 0;
            z-index: 320;
            display: grid;
            place-items: center;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            background:
                linear-gradient(110deg, rgba(255, 50, 154, 0.18), transparent 32%),
                linear-gradient(250deg, rgba(42, 231, 255, 0.2), transparent 38%),
                radial-gradient(circle at 50% 118%, rgba(255, 211, 74, 0.18), transparent 36%),
                #080812;
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }
        .pig-party.is-active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .pig-party::before {
            content: "";
            position: absolute;
            inset: -20%;
            background:
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.055) 0 1px, transparent 1px 86px),
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.04) 0 1px, transparent 1px 86px);
            transform: perspective(620px) rotateX(58deg) translateY(19%);
            transform-origin: bottom center;
            opacity: 0.5;
            animation: danceGrid 1.35s linear infinite;
        }
        .pig-party-close {
            position: absolute;
            top: 26px;
            right: 28px;
            z-index: 5;
            width: 42px;
            height: 42px;
            color: rgba(255, 255, 255, 0.78);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 50%;
            font-family: Arial, sans-serif;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.25s ease, color 0.25s ease, background 0.25s ease;
        }
        .pig-party-close:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.16);
            transform: scale(1.08);
        }
        .dj-beam {
            position: absolute;
            top: -14vh;
            width: 18vw;
            min-width: 160px;
            height: 118vh;
            opacity: 0.72;
            filter: blur(10px);
            mix-blend-mode: screen;
            transform-origin: top center;
            clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
        }
        .dj-beam--a {
            left: 6vw;
            background: linear-gradient(to bottom, rgba(255, 47, 141, 0.7), transparent 78%);
            animation: beamSweepA 1.8s ease-in-out infinite alternate;
        }
        .dj-beam--b {
            right: 9vw;
            background: linear-gradient(to bottom, rgba(43, 220, 255, 0.72), transparent 78%);
            animation: beamSweepB 1.55s ease-in-out infinite alternate;
        }
        .dj-beam--c {
            left: 38vw;
            background: linear-gradient(to bottom, rgba(255, 231, 91, 0.6), transparent 76%);
            animation: beamSweepC 1.25s ease-in-out infinite alternate;
        }
        .disco-ball {
            position: absolute;
            top: 8vh;
            left: 50%;
            width: clamp(62px, 8vw, 98px);
            aspect-ratio: 1;
            border-radius: 50%;
            background:
                linear-gradient(90deg, transparent 48%, rgba(0, 0, 0, 0.16) 49% 51%, transparent 52%),
                linear-gradient(0deg, transparent 48%, rgba(0, 0, 0, 0.12) 49% 51%, transparent 52%),
                repeating-linear-gradient(45deg, #f8f7ff 0 9px, #8fe9ff 9px 18px, #ff7cc6 18px 27px, #ffe05d 27px 36px);
            box-shadow: 0 0 34px rgba(255, 255, 255, 0.42);
            transform: translateX(-50%);
            animation: discoSpin 2s linear infinite;
        }
        .pig-stage {
            position: relative;
            z-index: 2;
            display: grid;
            place-items: center;
            width: min(92vw, 720px);
            min-height: min(72vh, 620px);
        }
        .pulse-ring {
            position: absolute;
            width: clamp(260px, 46vw, 560px);
            aspect-ratio: 1;
            border: 2px solid rgba(255, 255, 255, 0.16);
            border-radius: 50%;
            transform: rotateX(70deg);
            animation: pulseRing 1s ease-out infinite;
        }
        .pulse-ring--two {
            animation-delay: 0.35s;
        }
        .emoji-pig {
            position: relative;
            width: clamp(190px, 30vw, 330px);
            aspect-ratio: 1;
            border-radius: 49% 49% 45% 45%;
            background:
                radial-gradient(circle at 38% 32%, rgba(255, 255, 255, 0.72) 0 9%, transparent 10%),
                radial-gradient(circle at 65% 36%, rgba(255, 216, 226, 0.9) 0 18%, transparent 19%),
                linear-gradient(145deg, #ffd3dc 0%, #ff9fb5 55%, #ed7791 100%);
            box-shadow:
                inset -22px -26px 0 rgba(217, 91, 119, 0.22),
                inset 18px 22px 0 rgba(255, 255, 255, 0.22),
                0 26px 55px rgba(0, 0, 0, 0.42);
            transform-origin: 50% 82%;
            animation: pigDance 0.56s cubic-bezier(0.42, 0, 0.2, 1) infinite alternate;
        }
        .pig-ear {
            position: absolute;
            top: 4%;
            width: 29%;
            height: 32%;
            border-radius: 54% 54% 44% 44%;
            background: linear-gradient(145deg, #ffb4c5 0%, #ed7894 100%);
            box-shadow: inset -8px -10px 0 rgba(202, 79, 106, 0.18);
            z-index: -1;
        }
        .pig-ear::after {
            content: "";
            position: absolute;
            inset: 20% 22% 18%;
            border-radius: inherit;
            background: rgba(255, 126, 154, 0.68);
        }
        .pig-ear--left {
            left: 6%;
            transform: rotate(-30deg);
            animation: earBounceLeft 0.56s ease-in-out infinite alternate;
        }
        .pig-ear--right {
            right: 6%;
            transform: rotate(30deg);
            animation: earBounceRight 0.56s ease-in-out infinite alternate;
        }
        .pig-eye {
            position: absolute;
            top: 39%;
            width: 8.6%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #302329;
            box-shadow: inset 2px 2px 0 rgba(255, 255, 255, 0.32);
            animation: eyeGroove 1.12s steps(2, end) infinite;
        }
        .pig-eye--left { left: 32%; }
        .pig-eye--right { right: 32%; }
        .pig-snout {
            position: absolute;
            left: 50%;
            top: 51%;
            width: 38%;
            height: 28%;
            border-radius: 48% 48% 46% 46%;
            background: linear-gradient(160deg, #ffa4b8 0%, #e97491 100%);
            box-shadow:
                inset 9px 9px 0 rgba(255, 255, 255, 0.25),
                inset -10px -11px 0 rgba(190, 61, 92, 0.18);
            transform: translateX(-50%);
        }
        .pig-nostril {
            position: absolute;
            top: 45%;
            width: 14%;
            height: 30%;
            border-radius: 50%;
            background: #844257;
        }
        .pig-nostril--left { left: 27%; }
        .pig-nostril--right { right: 27%; }
        .pig-mouth {
            position: absolute;
            left: 50%;
            bottom: 13%;
            width: 18%;
            height: 8%;
            border-bottom: 5px solid #873c51;
            border-radius: 0 0 50% 50%;
            transform: translateX(-50%);
        }
        .pig-arm,
        .pig-leg {
            position: absolute;
            background: #ff9db4;
            box-shadow: inset -6px -6px 0 rgba(199, 69, 99, 0.16);
        }
        .pig-arm {
            top: 56%;
            width: 20%;
            height: 10%;
            border-radius: 999px;
            z-index: -1;
        }
        .pig-arm--left {
            left: -8%;
            transform-origin: right center;
            animation: armWaveLeft 0.56s ease-in-out infinite alternate;
        }
        .pig-arm--right {
            right: -8%;
            transform-origin: left center;
            animation: armWaveRight 0.56s ease-in-out infinite alternate;
        }
        .pig-leg {
            bottom: -7%;
            width: 15%;
            height: 18%;
            border-radius: 999px 999px 45% 45%;
            z-index: -1;
        }
        .pig-leg--left {
            left: 31%;
            animation: legHopLeft 0.56s ease-in-out infinite alternate;
        }
        .pig-leg--right {
            right: 31%;
            animation: legHopRight 0.56s ease-in-out infinite alternate;
        }
        .pig-shadow {
            position: absolute;
            bottom: 10%;
            width: clamp(190px, 34vw, 420px);
            height: 44px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            filter: blur(6px);
            animation: shadowBounce 0.56s ease-in-out infinite alternate;
        }
        .speaker {
            position: absolute;
            bottom: 8vh;
            width: clamp(74px, 10vw, 122px);
            height: clamp(118px, 17vw, 190px);
            border-radius: 8px;
            background: linear-gradient(145deg, #171722, #06060b);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 20px 38px rgba(0, 0, 0, 0.35);
        }
        .speaker::before,
        .speaker::after {
            content: "";
            position: absolute;
            left: 50%;
            border-radius: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle, #2bf1ff 0 16%, #252536 17% 54%, #050509 55%);
            animation: speakerThump 0.5s ease-in-out infinite alternate;
        }
        .speaker::before {
            top: 13%;
            width: 48%;
            aspect-ratio: 1;
        }
        .speaker::after {
            bottom: 12%;
            width: 66%;
            aspect-ratio: 1;
            background: radial-gradient(circle, #ff3b9d 0 14%, #29283a 15% 55%, #050509 56%);
            animation-delay: 0.13s;
        }
        .speaker--left { left: min(7vw, 90px); }
        .speaker--right { right: min(7vw, 90px); }

        @keyframes pigDance {
            0% { transform: translateY(0) rotate(-6deg) scaleX(1.02); }
            100% { transform: translateY(-22px) rotate(7deg) scaleX(0.98); }
        }
        @keyframes earBounceLeft {
            0% { transform: rotate(-37deg) translateY(3px); }
            100% { transform: rotate(-18deg) translateY(-7px); }
        }
        @keyframes earBounceRight {
            0% { transform: rotate(22deg) translateY(-5px); }
            100% { transform: rotate(39deg) translateY(4px); }
        }
        @keyframes armWaveLeft {
            0% { transform: rotate(25deg); }
            100% { transform: rotate(-38deg); }
        }
        @keyframes armWaveRight {
            0% { transform: rotate(-28deg); }
            100% { transform: rotate(40deg); }
        }
        @keyframes legHopLeft {
            0% { transform: rotate(7deg) translateY(4px); }
            100% { transform: rotate(-12deg) translateY(-4px); }
        }
        @keyframes legHopRight {
            0% { transform: rotate(12deg) translateY(-5px); }
            100% { transform: rotate(-7deg) translateY(4px); }
        }
        @keyframes eyeGroove {
            0%, 85% { transform: scaleY(1); }
            100% { transform: scaleY(0.18); }
        }
        @keyframes shadowBounce {
            0% { transform: scaleX(0.9); opacity: 0.48; }
            100% { transform: scaleX(1.08); opacity: 0.3; }
        }
        @keyframes beamSweepA {
            0% { transform: rotate(-25deg) translateX(-8vw); }
            100% { transform: rotate(24deg) translateX(13vw); }
        }
        @keyframes beamSweepB {
            0% { transform: rotate(24deg) translateX(8vw); }
            100% { transform: rotate(-23deg) translateX(-12vw); }
        }
        @keyframes beamSweepC {
            0% { transform: rotate(-10deg) translateX(-5vw); opacity: 0.4; }
            100% { transform: rotate(13deg) translateX(5vw); opacity: 0.8; }
        }
        @keyframes danceGrid {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 86px 0, 0 86px; }
        }
        @keyframes discoSpin {
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg); }
        }
        @keyframes pulseRing {
            0% { opacity: 0.65; transform: rotateX(70deg) scale(0.5); }
            100% { opacity: 0; transform: rotateX(70deg) scale(1.2); }
        }
        @keyframes speakerThump {
            0% { transform: translateX(-50%) scale(0.93); }
            100% { transform: translateX(-50%) scale(1.06); }
        }

        @media (max-width: 720px) {
            .speaker { display: none; }
            .disco-ball { top: 7vh; }
            .pig-stage { min-height: 68vh; }
        }

        @media (prefers-reduced-motion: reduce) {
            .pig-party *,
            .pig-party::before {
                animation-duration: 2.8s !important;
            }
        }
    </style>
</head>

<body>
    <div class="ui-overlay">
        <div class="title">Tim Jia</div>
        <div class="tagline">Systems / Networks / Landscapes</div>
    </div>

    <a href="https://work.timjia.com" class="alt-version-link">Switch to Simplistic Version ↗</a>

    <div id="globe-image-preview" class="globe-image-preview" aria-hidden="true">
        <div class="globe-image-preview__inner">
            <img id="globe-image-preview-img" alt="" decoding="async" />
        </div>
    </div>

    <div id="project-panel" class="project-panel">
        <div id="close-btn" class="close-btn">← Return to Globe</div>
        <div id="proj-title" class="proj-title"></div>
        <div id="proj-meta" class="proj-meta"></div>
        <div id="proj-content-container"></div>
    </div>

    <div id="pig-party" class="pig-party" aria-hidden="true">
        <button id="pig-party-close" class="pig-party-close" type="button" aria-label="Return to globe">x</button>
        <div class="dj-beam dj-beam--a"></div>
        <div class="dj-beam dj-beam--b"></div>
        <div class="dj-beam dj-beam--c"></div>
        <div class="disco-ball"></div>
        <div class="speaker speaker--left"></div>
        <div class="speaker speaker--right"></div>
        <div class="pig-stage">
            <div class="pulse-ring"></div>
            <div class="pulse-ring pulse-ring--two"></div>
            <div class="pig-shadow"></div>
            <div class="emoji-pig" role="img" aria-label="Dancing pig">
                <div class="pig-ear pig-ear--left"></div>
                <div class="pig-ear pig-ear--right"></div>
                <div class="pig-arm pig-arm--left"></div>
                <div class="pig-arm pig-arm--right"></div>
                <div class="pig-leg pig-leg--left"></div>
                <div class="pig-leg pig-leg--right"></div>
                <div class="pig-eye pig-eye--left"></div>
                <div class="pig-eye pig-eye--right"></div>
                <div class="pig-snout">
                    <div class="pig-nostril pig-nostril--left"></div>
                    <div class="pig-nostril pig-nostril--right"></div>
                </div>
                <div class="pig-mouth"></div>
            </div>
        </div>
    </div>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/",
                "d3-geo": "https://cdn.jsdelivr.net/npm/d3-geo@3/+esm",
                "topojson-client": "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm"
            }
        }
    </script>

    <script type="module">

        function getSphereCoords(lat, lon, radius) {
            const latRad = lat * Math.PI / 180;
            const lonRad = lon * Math.PI / 180;
            return new THREE.Vector3(
                radius * Math.cos(latRad) * Math.sin(lonRad),
                radius * Math.sin(latRad),
                radius * Math.cos(latRad) * Math.cos(lonRad)
            );
        }

        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

            document.querySelectorAll('#proj-content-container .proj-image').forEach((el) => {
                el.addEventListener('mouseenter', () => {
                    previewImg.src = el.currentSrc || el.src;
                    previewImg.alt = el.alt || '';
                    preview.classList.add('is-visible');
                    preview.setAttribute('aria-hidden', 'false');
                });
                el.addEventListener('mouseleave', () => {
                    preview.classList.remove('is-visible');
                    preview.setAttribute('aria-hidden', 'true');
                });
            });
        }

        function hideGlobeImagePreview() {

        function setupPigParty() {
            const party = document.getElementById('pig-party');
            const closeBtn = document.getElementById('pig-party-close');
            if (!party || !closeBtn || !renderer) return;

            renderer.domElement.addEventListener('pointerdown', startEarthHold);
            renderer.domElement.addEventListener('pointermove', trackEarthHold);
            renderer.domElement.addEventListener('pointerup', cancelEarthHold);
            renderer.domElement.addEventListener('pointerleave', cancelEarthHold);
            renderer.domElement.addEventListener('pointercancel', cancelEarthHold);

            closeBtn.addEventListener('click', (event) => {
                event.stopPropagation();
                stopPigParty();
            });
            party.addEventListener('click', (event) => {
                if (event.target === party) {
                    stopPigParty();
                }
            });
        }

        function startEarthHold(event) {
            if (event.button !== undefined && event.button !== 0) return;
            if (appState !== 'NORMAL' || pigPartyActive) return;

            earthHoldPointerId = event.pointerId;
            earthHoldStartX = event.clientX;
            earthHoldStartY = event.clientY;
            primePigAudio();

            if (renderer.domElement.setPointerCapture) {
                renderer.domElement.setPointerCapture(event.pointerId);
            }

            clearEarthHoldTimer();
            earthHoldTimer = window.setTimeout(() => {
                earthHoldTimer = null;
                startPigParty();
            }, EARTH_HOLD_MS);
        }

        function trackEarthHold(event) {
            if (earthHoldPointerId === null || event.pointerId !== earthHoldPointerId) return;
            const dx = event.clientX - earthHoldStartX;
            const dy = event.clientY - earthHoldStartY;
            if (Math.hypot(dx, dy) > EARTH_HOLD_MOVE_TOLERANCE) {
                cancelEarthHold(event);
            }
        }

        function cancelEarthHold(event) {
            if (event && earthHoldPointerId !== null && event.pointerId !== earthHoldPointerId) return;
            const pointerId = event ? event.pointerId : earthHoldPointerId;
            if (pointerId !== null && renderer.domElement.releasePointerCapture && renderer.domElement.hasPointerCapture(pointerId)) {
                renderer.domElement.releasePointerCapture(pointerId);
            }
            clearEarthHoldTimer();
            earthHoldPointerId = null;
        }

        function clearEarthHoldTimer() {
            if (!earthHoldTimer) return;
            window.clearTimeout(earthHoldTimer);
            earthHoldTimer = null;
        }

        function startPigParty() {
            const party = document.getElementById('pig-party');
            if (!party || pigPartyActive || appState !== 'NORMAL') return;

            cancelEarthHold();
            closeMarkerInlineMenu();

        function startPigBeat() {
            try {
                if (partyAudio.timer) return;
                primePigAudio();
                if (!partyAudio.ctx) return;

                partyAudio.ctx.resume();
                partyAudio.master = partyAudio.ctx.createGain();
                partyAudio.master.gain.setValueAtTime(0.16, partyAudio.ctx.currentTime);
                partyAudio.master.connect(partyAudio.ctx.destination);
                partyAudio.step = 0;
                playDjStep();
                partyAudio.timer = window.setInterval(playDjStep, 125);
            } catch (error) {
                console.warn('Pig party audio unavailable:', error);
            }
        }

        function primePigAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                if (!partyAudio.ctx) {
                    partyAudio.ctx = new AudioContext();
                }
                partyAudio.ctx.resume();
            } catch (error) {
                console.warn('Pig party audio could not start:', error);
            }
        }

        function stopPigBeat() {
            if (partyAudio.timer) {
                window.clearInterval(partyAudio.timer);
                partyAudio.timer = null;
            }
            if (partyAudio.master) {
                try {
                    partyAudio.master.gain.cancelScheduledValues(partyAudio.ctx.currentTime);
                    partyAudio.master.gain.setTargetAtTime(0.0001, partyAudio.ctx.currentTime, 0.03);
                    window.setTimeout(() => {
                        if (partyAudio.master) {
                            partyAudio.master.disconnect();
                            partyAudio.master = null;
                        }
                    }, 140);
                } catch (error) {
                    partyAudio.master = null;
                }
            }
        }

        function playDjStep() {
            if (!partyAudio.ctx || !partyAudio.master) return;

            const step = partyAudio.step % 16;
            if (step % 4 === 0) playKick();
            if (step === 4 || step === 12) playSnare();
            if (step % 2 === 0) playHat();
            if (step === 0 || step === 3 || step === 8 || step === 10) {
                playBass(step === 8 ? 98 : 82);
            }
            if (step === 6 || step === 14) {
                playPigSqueal();
            }
            partyAudio.step += 1;
        }

        function playKick() {
            const ctx = partyAudio.ctx;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const now = ctx.currentTime;

            osc.type = 'sine';
            osc.frequency.setValueAtTime(145, now);
            osc.frequency.exponentialRampToValueAtTime(45, now + 0.14);
            gain.gain.setValueAtTime(0.95, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

            osc.connect(gain).connect(partyAudio.master);
            osc.start(now);
            osc.stop(now + 0.19);
        }

        function playSnare() {
            playNoise(0.13, 0.35, 1800, 'bandpass');
            playTone(188, 'triangle', 0.09, 0.18);
        }

        function playHat() {
            playNoise(0.045, 0.16, 7600, 'highpass');
        }

        function playBass(freq) {
            playTone(freq, 'sawtooth', 0.18, 0.22);
        }

        function playPigSqueal() {
            const ctx = partyAudio.ctx;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const now = ctx.currentTime;

            osc.type = 'square';
            osc.frequency.setValueAtTime(640, now);
            osc.frequency.exponentialRampToValueAtTime(980, now + 0.06);
            osc.frequency.exponentialRampToValueAtTime(520, now + 0.15);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.exponentialRampToValueAtTime(0.16, now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

            osc.connect(gain).connect(partyAudio.master);
            osc.start(now);
            osc.stop(now + 0.17);
        }

        function playTone(freq, type, duration, gainValue) {
            const ctx = partyAudio.ctx;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const now = ctx.currentTime;

            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.exponentialRampToValueAtTime(gainValue, now + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(gain).connect(partyAudio.master);
            osc.start(now);
            osc.stop(now + duration + 0.02);
        }

        function playNoise(duration, gainValue, frequency, filterType) {
            const ctx = partyAudio.ctx;
            const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * duration), ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const source = ctx.createBufferSource();
            const filter = ctx.createBiquadFilter();
            const gain = ctx.createGain();
            const now = ctx.currentTime;

            source.buffer = buffer;
            filter.type = filterType;
            filter.frequency.setValueAtTime(frequency, now);
            filter.Q.setValueAtTime(1.8, now);
            gain.gain.setValueAtTime(gainValue, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            source.connect(filter).connect(gain).connect(partyAudio.master);
            source.start(now);
            source.stop(now + duration);
        }

        async function loadWorldMap() {
            try {
                const response = await fetch(WORLD_ATLAS_URL, { cache: 'force-cache' });
                const world = await response.json();
                const landFeatures = feature(world, world.objects.land || world.objects.countries);

                addContinentBorders(landFeatures);
                createDotGlobeFromRealMap(landFeatures);
                addResumeMarkers();
            } catch (error) {
                console.error('World map failed to load:', error);
            }
        }

        function addContinentBorders(landFeatures) {
            const lineMat = new THREE.LineBasicMaterial({
                color: 0xffffff, transparent: true, opacity: 0.055, depthTest: true, depthWrite: false
            });
            const lineGeo = new THREE.BufferGeometry();
            const linePositions = [];

            const extractLine = (polygon) => {
                polygon.forEach((ring) => {
                    for (let i = 0; i < ring.length - 1; i++) {
                        const p1 = getSphereCoords(ring[i][1], ring[i][0], EARTH_RADIUS + 0.08);
                        const p2 = getSphereCoords(ring[i + 1][1], ring[i + 1][0], EARTH_RADIUS + 0.08);
                        linePositions.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
                    }
                });
            };

            const features = landFeatures.type === 'FeatureCollection' ? landFeatures.features : [landFeatures];
            features.forEach((item) => {
                if (!item.geometry) return;
                if (item.geometry.type === 'Polygon') extractLine(item.geometry.coordinates);
                else if (item.geometry.type === 'MultiPolygon') item.geometry.coordinates.forEach((poly) => extractLine(poly));
            });

            lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
            const continentLines = new THREE.LineSegments(lineGeo, lineMat);
            continentLines.renderOrder = 1;
            earthGroup.add(continentLines);
        }

        function createDotGlobeFromRealMap(geoFeatures) {
            const canvas = document.createElement('canvas');
            canvas.width = 3072; canvas.height = 1536;
            const context = canvas.getContext('2d', { willReadFrequently: true });
            const projection = geoEquirectangular().translate([canvas.width / 2, canvas.height / 2]).scale(canvas.width / (2 * Math.PI));
            const path = geoPath(projection, context);

            context.fillStyle = '#000'; context.fillRect(0, 0, canvas.width, canvas.height);
            context.fillStyle = '#fff'; context.beginPath(); path(geoFeatures); context.fill();

            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const isInverted = imageData.data[0] > 128;
            const landPositions = [], landColors = [], landSizes = [];

            for (let lat = -88.5; lat <= 88.5; lat += DETAIL_STEP) {
                for (let lon = -180; lon <= 180; lon += DETAIL_STEP) {
                    const projected = projection([lon, lat]);
                    if (!projected) continue;
                    const px = Math.floor(projected[0]); const py = Math.floor(projected[1]);
                    if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;

                    const dataIndex = (py * canvas.width + px) * 4;
                    const isWhite = imageData.data[dataIndex] > 128;
                    const isLand = isInverted ? !isWhite : isWhite;

                    if (!isLand || Math.random() > 0.985) continue;

                    const pos = getSphereCoords(lat, lon, EARTH_RADIUS + (Math.random() - 0.5) * 0.25);
                    landPositions.push(pos.x, pos.y, pos.z);
                    const b = 0.78 + Math.random() * 0.18;
                    landColors.push(b, b, b);
                    landSizes.push(0.55 + Math.random() * 0.35); 
                }
            }
            const dots = createPointSystem(landPositions, landColors, landSizes, 0.92);
            dots.renderOrder = 2;
            earthGroup.add(dots);
        }

        function addResumeMarkers() {

            const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: true, depthWrite: true });
            const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.24, depthTest: true, depthWrite: false });

            resumeLocations.forEach((loc) => {
                const localPos = getSphereCoords(loc.lat, loc.lon, EARTH_RADIUS + 0.5);
                const dot = new THREE.Mesh(dotGeo, dotMat);
                dot.position.copy(localPos);
                earthGroup.add(dot);

                const lineLength = 10 + Math.random() * 6;
                const endPos = localPos.clone().normalize().multiplyScalar(EARTH_RADIUS + lineLength);
                const lineGeo = new THREE.BufferGeometry().setFromPoints([localPos, endPos]);
                const line = new THREE.Line(lineGeo, lineMat);
                earthGroup.add(line);

                const div = document.createElement('div');

                if (loc.hasProjectMenu && loc.projectMenu) {
                    div.className = 'marker-label marker-label--menu';
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'marker-label-name';
                    nameSpan.textContent = loc.name;
                    const menu = document.createElement('div');
                    menu.className = 'marker-inline-menu';
                    menu.setAttribute('aria-hidden', 'true');
                    loc.projectMenu.forEach((item) => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'marker-inline-menu-btn';
                        btn.textContent = item.label;
                        btn.addEventListener('click', (ev) => {
                            ev.stopPropagation();
                            if (appState !== 'NORMAL') return;
                            const worldPos = new THREE.Vector3();
                            dot.getWorldPosition(worldPos);
                            closeMarkerInlineMenu({ restoreRotate: false });
                            openProjectPanel(item.project, localPos, worldPos);
                        });
                        menu.appendChild(btn);
                    });
                    div.appendChild(nameSpan);
                    div.appendChild(menu);

                    nameSpan.addEventListener('click', (event) => {
                        event.stopPropagation();
                        if (appState !== 'NORMAL') return;
                        const wasOpen = menu.classList.contains('is-open');
                        closeMarkerInlineMenu();
                        if (!wasOpen) {
                            menu.classList.add('is-open');
                            menu.setAttribute('aria-hidden', 'false');
                            activeMarkerMenuRoot = div;
                            if (controls) {
                                controls.autoRotate = false;
                            }
                        }
                    });
                } else {
                    div.className = 'marker-label';
                    div.textContent = loc.name;
                    div.addEventListener('click', (event) => {
                        event.stopPropagation();
                        if (appState !== 'NORMAL') return;
                        if (!loc.hasProject || !loc.project) return;
                        const worldPos = new THREE.Vector3();
                        dot.getWorldPosition(worldPos);
                        openProjectPanel(loc.project, localPos, worldPos);
                    });
                }

                if (loc.hasProjectMenu && loc.projectMenu) {
                    div.addEventListener('mouseenter', () => {
                        if (appState !== 'NORMAL') return;
                        if (activeMarkerMenuRoot === div) return;
                        controls.autoRotateSpeed = 0.05;
                    });
                    div.addEventListener('mouseleave', () => {
                        if (appState !== 'NORMAL') return;
                        if (activeMarkerMenuRoot === div) return;
                        controls.autoRotateSpeed = 0.8;
                    });
                } else {
                    div.addEventListener('mouseenter', () => {
                        if (appState === 'NORMAL') controls.autoRotateSpeed = 0.05;
                    });
                    div.addEventListener('mouseleave', () => {
                        if (appState === 'NORMAL') controls.autoRotateSpeed = 0.8;
                    });
                }

                const label = new CSS2DObject(div);
                label.position.copy(endPos);
                earthGroup.add(label);
            });
        }

        function openProjectPanel(project, localPos, worldPos) {
            document.getElementById('proj-title').innerText = project.title;
            document.getElementById('proj-meta').innerHTML = project.meta.replace(/\n/g, '<br>');

            const descParts = project.desc.split(/\n\n+/).map((s) => s.trim()).filter(Boolean);
            let contentHTML = descParts.map((p) => `<div class="proj-desc">${p}</div>`).join('');
            if (project.images && project.images.length > 0) {
                project.images.forEach((imgUrl) => {
                    contentHTML += `<img src="${imgUrl}" class="proj-image" alt="Project Documentation" />`;
                });
            }
            document.getElementById('proj-content-container').innerHTML = contentHTML;
            bindGlobeImagePreview();

            document.getElementById('project-panel').classList.add('active');

            savedCameraPos.copy(camera.position);
            
            camStartPos.copy(camera.position);
            camTargetPos.copy(worldPos).normalize().multiplyScalar(FOCUS_CAMERA_Z);
            
            viewOffsetStart = currentViewOffsetX;
            targetViewOffsetX = window.innerWidth * 0.22;

            appState = 'FOCUSING';
            animProgress = 0; 

            controls.enabled = false;
            controls.autoRotate = false;
            
            if (globeMaterial) {
                globeMaterial.uniforms.uFocusPos.value.copy(localPos);
            }
        }

        function closeProjectPanel() {
            hideGlobeImagePreview();
            closeMarkerInlineMenu();
            document.getElementById('project-panel').classList.remove('active');
            
            camStartPos.copy(camera.position);
            viewOffsetStart = currentViewOffsetX;
            
            appState = 'RETURNING';
            animProgress = 0; 
        }

        function createPointSystem(positions, colors, sizes, opacity) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            globeMaterial = new THREE.ShaderMaterial({
                uniforms: { 
                    opacity: { value: opacity },
                    uTime: { value: 0 },
                    uFocusPos: { value: new THREE.Vector3(0,0,0) },
                    uFocusProgress: { value: 0 }
                },
                vertexShader: `
                    uniform float uTime;
                    uniform vec3 uFocusPos;
                    uniform float uFocusProgress;
                    attribute float size; 
                    varying vec3 vColor; 
                    varying float vFacing;

                    void main() {
                        vColor = color;
                        vec3 normPos = normalize(position);
                        
                        float dist = 0.0;
                        float influence = 0.0;
                        float breath = 0.0;
                        vec3 displacedPos = position;

                        if (length(uFocusPos) > 10.0) {
                            vec3 normFocus = normalize(uFocusPos);
                            dist = distance(normPos, normFocus);
                            influence = smoothstep(0.45, 0.0, dist) * uFocusProgress;
                            
                            breath = sin(uTime * 2.8 - dist * 15.0) * 1.8 * influence;
                            
                            vec3 tangentDir = normPos - normFocus * dot(normPos, normFocus);
                            if (length(tangentDir) > 0.001) {
                                tangentDir = normalize(tangentDir);
                            } else {
                                tangentDir = vec3(0.0);
                            }
                            
                            displacedPos = position + normPos * breath + tangentDir * (breath * 0.8);
                        }

                        vec4 worldPosition = modelMatrix * vec4(displacedPos, 1.0);
                        vec3 sphereNormal = normalize(mat3(modelMatrix) * normPos);
                        vec3 viewDirection = normalize(cameraPosition - worldPosition.xyz);
                        vFacing = smoothstep(-0.12, 0.38, dot(sphereNormal, viewDirection));
                        
                        vec4 mvPosition = modelViewMatrix * vec4(displacedPos, 1.0);
                        
                        float sizePulse = 1.0 + breath * 0.5;
                        gl_PointSize = (size * sizePulse) * (260.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform float opacity; varying vec3 vColor; varying float vFacing;
                    void main() {
                        float d = distance(gl_PointCoord, vec2(0.5));
                        if (d > 0.5) discard;
                        float pointAlpha = 1.0 - smoothstep(0.12, 0.5, d);
                        float finalAlpha = pointAlpha * opacity * vFacing;
                        if (finalAlpha < 0.015) discard;
                        gl_FragColor = vec4(vColor, finalAlpha);
                    }
                `,
                vertexColors: true, transparent: true, depthTest: true, depthWrite: true, blending: THREE.NormalBlending
            });

            return new THREE.Points(geometry, globeMaterial);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.05);
            timeOffset += dt;

            if (globeMaterial) {
                globeMaterial.uniforms.uTime.value = timeOffset;
            }

            if (earthGroup) {
                if (appState === 'NORMAL') {
                    controls.update(); 
                    if (globeMaterial) globeMaterial.uniforms.uFocusProgress.value = 0;

                } else if (appState === 'FOCUSING') {
                    animProgress += dt * 1.0; 
                    if (animProgress >= 1.0) {
                        animProgress = 1.0;
                        appState = 'FOCUSED';
                    }

                    let ease = easeOutCubic(animProgress);

                    const curDir = camStartPos.clone().normalize();
                    const targetDir = camTargetPos.clone().normalize();
                    curDir.lerp(targetDir, ease).normalize(); 
                    
                    const curLen = THREE.MathUtils.lerp(camStartPos.length(), FOCUS_CAMERA_Z, ease);
                    camera.position.copy(curDir).multiplyScalar(curLen);
                    camera.lookAt(0, 0, 0);

                    currentViewOffsetX = THREE.MathUtils.lerp(viewOffsetStart, targetViewOffsetX, ease);
                    if (Math.abs(currentViewOffsetX) > 0.1) {
                        camera.setViewOffset(window.innerWidth, window.innerHeight, currentViewOffsetX, 0, window.innerWidth, window.innerHeight);
                    }
                    
                    if (globeMaterial) globeMaterial.uniforms.uFocusProgress.value = ease;

                } else if (appState === 'FOCUSED') {
                    camera.lookAt(0, 0, 0);

                } else if (appState === 'RETURNING') {
                    animProgress += dt * 1.0;
                    if (animProgress >= 1.0) {
                        animProgress = 1.0;
                        appState = 'NORMAL';
                        
                        camera.position.copy(savedCameraPos);
                        camera.lookAt(0, 0, 0);
                        camera.clearViewOffset();
                        
                        controls.enabled = true;
                        controls.autoRotate = true;
                        controls.target.set(0,0,0);
                        controls.update();
                    }

                    let ease = easeOutCubic(animProgress);

                    const curDir = camStartPos.clone().normalize();
                    const targetDir = savedCameraPos.clone().normalize();
                    curDir.lerp(targetDir, ease).normalize(); 
                    
                    const curLen = THREE.MathUtils.lerp(camStartPos.length(), savedCameraPos.length(), ease);
                    camera.position.copy(curDir).multiplyScalar(curLen);
                    camera.lookAt(0, 0, 0);

                    currentViewOffsetX = THREE.MathUtils.lerp(viewOffsetStart, 0, ease);
                    if (Math.abs(currentViewOffsetX) > 0.1) {
                        camera.setViewOffset(window.innerWidth, window.innerHeight, currentViewOffsetX, 0, window.innerWidth, window.innerHeight);
                    } else {
                        camera.clearViewOffset();
                    }

                    if (globeMaterial) globeMaterial.uniforms.uFocusProgress.value = 1.0 - ease;
                }
            }

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
