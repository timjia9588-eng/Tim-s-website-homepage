<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Jia | Systems & Networks</title>

    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json" as="fetch" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Roboto Mono', monospace; }
        canvas { display: block; }

        .ui-overlay { position: absolute; top: 40px; left: 40px; color: rgba(255, 255, 255, 0.7); z-index: 10; pointer-events: none; }
        .title { font-size: 1.2rem; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 10px; }
        .tagline { font-size: 0.7rem; opacity: 0.5; letter-spacing: 0.1em; }

        .marker-label {
            color: #fff;
            font-family: 'Roboto Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.1em;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.72);
            padding: 4px 8px;
            border-left: 2px solid rgba(255, 255, 255, 0.85);
            white-space: nowrap;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), background 0.45s ease, color 0.45s ease, border-left 0.45s ease;
            transform-origin: left center;
            will-change: transform;
        }

        .marker-label:hover {
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            transform: translate3d(10px, 0, 0) scale(1.12);
            border-left: 4px solid #fff;
            z-index: 100;
        }

        .project-panel {
            position: absolute; top: 0; right: 0; width: 450px; height: 100vh;
            background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255, 255, 255, 0.1); color: #fff;
            padding: 60px 40px; box-sizing: border-box;
            transform: translateX(100%); transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200; overflow-y: auto; display: flex; flex-direction: column;
        }

        .project-panel.active { transform: translateX(0); }

        .close-btn { align-self: flex-start; color: rgba(255, 255, 255, 0.5); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; margin-bottom: 40px; transition: color 0.3s; }
        .close-btn:hover { color: #fff; }

        .proj-title { font-size: 1.5rem; letter-spacing: 0.1em; margin-bottom: 20px; font-weight: 400; text-transform: uppercase; }
        .proj-meta { font-size: 0.7rem; line-height: 1.6; color: rgba(255, 255, 255, 0.6); margin-bottom: 40px; padding-left: 15px; border-left: 1px solid rgba(255, 255, 255, 0.3); }
        .proj-desc { font-size: 0.8rem; line-height: 1.8; color: rgba(255, 255, 255, 0.8); text-align: justify; }

        .project-panel::-webkit-scrollbar { width: 4px; }
        .project-panel::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>

<body>
    <div class="ui-overlay">
        <div class="title">Tim Jia</div>
        <div class="tagline">Systems / Networks / Landscapes</div>
    </div>

    <div id="project-panel" class="project-panel">
        <div id="close-btn" class="close-btn">← Return to Globe</div>
        <div id="proj-title" class="proj-title"></div>
        <div id="proj-meta" class="proj-meta"></div>
        <div id="proj-desc" class="proj-desc"></div>
    </div>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/",
                "d3-geo": "https://cdn.jsdelivr.net/npm/d3-geo@3/+esm",
                "topojson-client": "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        import { geoEquirectangular, geoPath } from 'd3-geo';
        import { feature } from 'topojson-client';

        let scene, camera, renderer, labelRenderer, controls, earthGroup;
        let globeMaterial; 

        // --- 动画时间轴架构 ---
        let appState = 'NORMAL'; 
        let animProgress = 0;    
        
        let savedCameraPos = new THREE.Vector3();
        let camStartPos = new THREE.Vector3();
        let camTargetPos = new THREE.Vector3();
        
        let viewOffsetStart = 0;
        let targetViewOffsetX = 0;
        let currentViewOffsetX = 0;
        
        let timeOffset = 0;

        const clock = new THREE.Clock();
        const FOCUS_CAMERA_Z = 120; 
        const NORMAL_CAMERA_Z = 250;
        const BASE_TILT_X = 0.15;

        const WORLD_ATLAS_URL = 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json';
        const DETAIL_STEP = 0.45; 
        const EARTH_RADIUS = 80;

        const resumeLocations = [
            { name: "Harvard GSD", lat: 42.37, lon: -71.11 },
            { name: "Cornell Univ", lat: 42.44, lon: -76.50 },
            { name: "Urban Alchemy (TX)", lat: 29.42, lon: -98.49 },
            { name: "Design Workshop", lat: 39.19, lon: -106.81 },
            { name: "Waggonner & Ball", lat: 29.95, lon: -90.07 },
            { name: "EDSA", lat: 26.12, lon: -80.14 },
            {
                name: "Tsinghua Univ", lat: 39.90, lon: 116.40,
                hasProject: true,
                project: {
                    title: "Xiaozhou Village",
                    meta: "\"Discussion on the construction of environmental and cultural tourism in Xiaozhou Village.\"\nTsinghua University School of Architecture Term Paper (2021)\nIndividually researched under the advisement of Dr. Jian Liu\nSelected as the Excellent Paper for the course",
                    desc: "This research examines the systemic decline of Xiaozhou Village (小洲村), a historical and cultural protection area in Guangzhou. Through field surveys and interviews, I analyzed the ways in which environmental stressors such as water pollution and waste accumulation directly impact local economic stability and cultural inheritance. Utilizing a demand analysis model, the study evaluates the conflicting spatial requirements of residents, artists, and visitors within the context of heritage preservation. By developing a zoning strategy and an environmental improvement framework, I proposed a planning model that prioritizes ecological restoration as a prerequisite for sustainable tourism. This project serves as an early exploration of place-based inquiry, demonstrating the inextricable link between architectural preservation and the agency of the local population."
                }
            },
            { name: "Shenzhen (SZLA)", lat: 22.54, lon: 114.05 },
            { name: "Nepal Project", lat: 28.39, lon: 84.12 }
        ];

        function getSphereCoords(lat, lon, radius) {
            const latRad = lat * Math.PI / 180;
            const lonRad = lon * Math.PI / 180;
            return new THREE.Vector3(
                radius * Math.cos(latRad) * Math.sin(lonRad),
                radius * Math.sin(latRad),
                radius * Math.cos(latRad) * Math.cos(lonRad)
            );
        }

        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(getSphereCoords(30, 110, NORMAL_CAMERA_Z));

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            labelRenderer.domElement.style.left = '0px';
            labelRenderer.domElement.style.pointerEvents = 'none';
            document.body.appendChild(labelRenderer.domElement);

            earthGroup = new THREE.Group();
            earthGroup.rotation.order = 'YXZ';
            earthGroup.rotation.x = BASE_TILT_X;
            scene.add(earthGroup);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.055;
            controls.enableZoom = true;
            controls.zoomSpeed = 0.75;
            controls.minDistance = 95;
            controls.maxDistance = 430;
            controls.enablePan = false;
            
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.8;

            window.addEventListener('resize', onWindowResize);
            
            document.getElementById('close-btn').addEventListener('click', () => {
                if (appState === 'FOCUSED' || appState === 'FOCUSING') {
                    closeProjectPanel();
                }
            });

            animate();
            loadWorldMap();
        }

        async function loadWorldMap() {
            try {
                const response = await fetch(WORLD_ATLAS_URL, { cache: 'force-cache' });
                const world = await response.json();
                const landFeatures = feature(world, world.objects.land || world.objects.countries);

                addContinentBorders(landFeatures);
                createDotGlobeFromRealMap(landFeatures);
                addResumeMarkers();
            } catch (error) {
                console.error('World map failed to load:', error);
            }
        }

        function addContinentBorders(landFeatures) {
            const lineMat = new THREE.LineBasicMaterial({
                color: 0xffffff, transparent: true, opacity: 0.055, depthTest: true, depthWrite: false
            });
            const lineGeo = new THREE.BufferGeometry();
            const linePositions = [];

            const extractLine = (polygon) => {
                polygon.forEach((ring) => {
                    for (let i = 0; i < ring.length - 1; i++) {
                        const p1 = getSphereCoords(ring[i][1], ring[i][0], EARTH_RADIUS + 0.08);
                        const p2 = getSphereCoords(ring[i + 1][1], ring[i + 1][0], EARTH_RADIUS + 0.08);
                        linePositions.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
                    }
                });
            };

            const features = landFeatures.type === 'FeatureCollection' ? landFeatures.features : [landFeatures];
            features.forEach((item) => {
                if (!item.geometry) return;
                if (item.geometry.type === 'Polygon') extractLine(item.geometry.coordinates);
                else if (item.geometry.type === 'MultiPolygon') item.geometry.coordinates.forEach((poly) => extractLine(poly));
            });

            lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
            const continentLines = new THREE.LineSegments(lineGeo, lineMat);
            continentLines.renderOrder = 1;
            earthGroup.add(continentLines);
        }

        function createDotGlobeFromRealMap(geoFeatures) {
            const canvas = document.createElement('canvas');
            canvas.width = 3072; canvas.height = 1536;
            const context = canvas.getContext('2d', { willReadFrequently: true });
            const projection = geoEquirectangular().translate([canvas.width / 2, canvas.height / 2]).scale(canvas.width / (2 * Math.PI));
            const path = geoPath(projection, context);

            context.fillStyle = '#000'; context.fillRect(0, 0, canvas.width, canvas.height);
            context.fillStyle = '#fff'; context.beginPath(); path(geoFeatures); context.fill();

            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const isInverted = imageData.data[0] > 128;
            const landPositions = [], landColors = [], landSizes = [];

            for (let lat = -88.5; lat <= 88.5; lat += DETAIL_STEP) {
                for (let lon = -180; lon <= 180; lon += DETAIL_STEP) {
                    const projected = projection([lon, lat]);
                    if (!projected) continue;
                    const px = Math.floor(projected[0]); const py = Math.floor(projected[1]);
                    if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;

                    const dataIndex = (py * canvas.width + px) * 4;
                    const isWhite = imageData.data[dataIndex] > 128;
                    const isLand = isInverted ? !isWhite : isWhite;

                    if (!isLand || Math.random() > 0.985) continue;

                    const pos = getSphereCoords(lat, lon, EARTH_RADIUS + (Math.random() - 0.5) * 0.25);
                    landPositions.push(pos.x, pos.y, pos.z);
                    const b = 0.78 + Math.random() * 0.18;
                    landColors.push(b, b, b);
                    landSizes.push(0.55 + Math.random() * 0.35); 
                }
            }
            const dots = createPointSystem(landPositions, landColors, landSizes, 0.92);
            dots.renderOrder = 2;
            earthGroup.add(dots);
        }

        function addResumeMarkers() {
            const dotGeo = new THREE.SphereGeometry(0.6, 12, 12);
            const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: true, depthWrite: true });
            const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.24, depthTest: true, depthWrite: false });

            resumeLocations.forEach((loc) => {
                const pos = getSphereCoords(loc.lat, loc.lon, EARTH_RADIUS + 0.5);
                const dot = new THREE.Mesh(dotGeo, dotMat);
                dot.position.copy(pos);
                earthGroup.add(dot);

                const lineLength = 10 + Math.random() * 6;
                const endPos = pos.clone().normalize().multiplyScalar(EARTH_RADIUS + lineLength);
                const lineGeo = new THREE.BufferGeometry().setFromPoints([pos, endPos]);
                const line = new THREE.Line(lineGeo, lineMat);
                earthGroup.add(line);

                const div = document.createElement('div');
                div.className = 'marker-label';
                div.textContent = loc.name;

                div.addEventListener('mouseenter', () => { 
                    if (appState === 'NORMAL') controls.autoRotateSpeed = 0.05; 
                });
                div.addEventListener('mouseleave', () => { 
                    if (appState === 'NORMAL') controls.autoRotateSpeed = 0.8;  
                });

                div.addEventListener('click', (event) => {
                    event.stopPropagation();
                    if (loc.hasProject && appState === 'NORMAL') {
                        const worldPos = new THREE.Vector3();
                        dot.getWorldPosition(worldPos); 
                        openProjectPanel(loc, pos, worldPos);
                    }
                });

                const label = new CSS2DObject(div);
                label.position.copy(endPos);
                earthGroup.add(label);
            });
        }

        function openProjectPanel(loc, localPos, worldPos) {
            document.getElementById('proj-title').innerText = loc.project.title;
            document.getElementById('proj-meta').innerHTML = loc.project.meta.replace(/\n/g, '<br>');
            document.getElementById('proj-desc').innerText = loc.project.desc;
            document.getElementById('project-panel').classList.add('active');

            savedCameraPos.copy(camera.position);
            
            camStartPos.copy(camera.position);
            camTargetPos.copy(worldPos).normalize().multiplyScalar(FOCUS_CAMERA_Z);
            
            viewOffsetStart = currentViewOffsetX;
            targetViewOffsetX = window.innerWidth * 0.22;

            appState = 'FOCUSING';
            animProgress = 0; 

            controls.enabled = false;
            controls.autoRotate = false;
            
            if (globeMaterial) {
                globeMaterial.uniforms.uFocusPos.value.copy(localPos);
            }
        }

        function closeProjectPanel() {
            document.getElementById('project-panel').classList.remove('active');
            
            camStartPos.copy(camera.position);
            viewOffsetStart = currentViewOffsetX;
            
            appState = 'RETURNING';
            animProgress = 0; 
        }

        function createPointSystem(positions, colors, sizes, opacity) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            globeMaterial = new THREE.ShaderMaterial({
                uniforms: { 
                    opacity: { value: opacity },
                    uTime: { value: 0 },
                    uFocusPos: { value: new THREE.Vector3(0,0,0) },
                    uFocusProgress: { value: 0 }
                },
                vertexShader: `
                    uniform float uTime;
                    uniform vec3 uFocusPos;
                    uniform float uFocusProgress;
                    attribute float size; 
                    varying vec3 vColor; 
                    varying float vFacing;

                    void main() {
                        vColor = color;
                        vec3 normPos = normalize(position);
                        
                        float dist = 0.0;
                        float influence = 0.0;
                        float breath = 0.0;
                        vec3 displacedPos = position;

                        if (length(uFocusPos) > 10.0) {
                            vec3 normFocus = normalize(uFocusPos);
                            dist = distance(normPos, normFocus);
                            influence = smoothstep(0.45, 0.0, dist) * uFocusProgress;
                            
                            breath = sin(uTime * 2.8 - dist * 15.0) * 1.8 * influence;
                            
                            vec3 tangentDir = normPos - normFocus * dot(normPos, normFocus);
                            if (length(tangentDir) > 0.001) {
                                tangentDir = normalize(tangentDir);
                            } else {
                                tangentDir = vec3(0.0);
                            }
                            
                            displacedPos = position + normPos * breath + tangentDir * (breath * 0.8);
                        }

                        vec4 worldPosition = modelMatrix * vec4(displacedPos, 1.0);
                        vec3 sphereNormal = normalize(mat3(modelMatrix) * normPos);
                        vec3 viewDirection = normalize(cameraPosition - worldPosition.xyz);
                        vFacing = smoothstep(-0.12, 0.38, dot(sphereNormal, viewDirection));
                        
                        vec4 mvPosition = modelViewMatrix * vec4(displacedPos, 1.0);
                        
                        float sizePulse = 1.0 + breath * 0.5;
                        gl_PointSize = (size * sizePulse) * (260.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform float opacity; varying vec3 vColor; varying float vFacing;
                    void main() {
                        float d = distance(gl_PointCoord, vec2(0.5));
                        if (d > 0.5) discard;
                        float pointAlpha = 1.0 - smoothstep(0.12, 0.5, d);
                        float finalAlpha = pointAlpha * opacity * vFacing;
                        if (finalAlpha < 0.015) discard;
                        gl_FragColor = vec4(vColor, finalAlpha);
                    }
                `,
                vertexColors: true, transparent: true, depthTest: true, depthWrite: true, blending: THREE.NormalBlending
            });

            return new THREE.Points(geometry, globeMaterial);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.05);
            timeOffset += dt;

            if (globeMaterial) {
                globeMaterial.uniforms.uTime.value = timeOffset;
            }

            if (earthGroup) {
                if (appState === 'NORMAL') {
                    controls.update(); 
                    if (globeMaterial) globeMaterial.uniforms.uFocusProgress.value = 0;

                } else if (appState === 'FOCUSING') {
                    animProgress += dt * 1.0; 
                    if (animProgress >= 1.0) {
                        animProgress = 1.0;
                        appState = 'FOCUSED';
                    }

                    let ease = easeOutCubic(animProgress);

                    // 核心修复：纯血 Lerp，彻底避开会导致系统崩溃的 Slerp
                    const curDir = camStartPos.clone().normalize();
                    const targetDir = camTargetPos.clone().normalize();
                    curDir.lerp(targetDir, ease).normalize(); 
                    
                    const curLen = THREE.MathUtils.lerp(camStartPos.length(), FOCUS_CAMERA_Z, ease);
                    camera.position.copy(curDir).multiplyScalar(curLen);
                    camera.lookAt(0, 0, 0);

                    currentViewOffsetX = THREE.MathUtils.lerp(viewOffsetStart, targetViewOffsetX, ease);
                    if (Math.abs(currentViewOffsetX) > 0.1) {
                        camera.setViewOffset(window.innerWidth, window.innerHeight, currentViewOffsetX, 0, window.innerWidth, window.innerHeight);
                    }
                    
                    if (globeMaterial) globeMaterial.uniforms.uFocusProgress.value = ease;

                } else if (appState === 'FOCUSED') {
                    camera.lookAt(0, 0, 0);

                } else if (appState === 'RETURNING') {
                    animProgress += dt * 1.0;
                    if (animProgress >= 1.0) {
                        animProgress = 1.0;
                        appState = 'NORMAL';
                        
                        camera.position.copy(savedCameraPos);
                        camera.lookAt(0, 0, 0);
                        camera.clearViewOffset();
                        
                        controls.enabled = true;
                        controls.autoRotate = true;
                        controls.target.set(0,0,0);
                        controls.update();
                    }

                    let ease = easeOutCubic(animProgress);

                    // 核心修复：同理，退出时也使用绝对安全的 Lerp 向量插值
                    const curDir = camStartPos.clone().normalize();
                    const targetDir = savedCameraPos.clone().normalize();
                    curDir.lerp(targetDir, ease).normalize(); 
                    
                    const curLen = THREE.MathUtils.lerp(camStartPos.length(), savedCameraPos.length(), ease);
                    camera.position.copy(curDir).multiplyScalar(curLen);
                    camera.lookAt(0, 0, 0);

                    currentViewOffsetX = THREE.MathUtils.lerp(viewOffsetStart, 0, ease);
                    if (Math.abs(currentViewOffsetX) > 0.1) {
                        camera.setViewOffset(window.innerWidth, window.innerHeight, currentViewOffsetX, 0, window.innerWidth, window.innerHeight);
                    } else {
                        camera.clearViewOffset();
                    }

                    if (globeMaterial) globeMaterial.uniforms.uFocusProgress.value = 1.0 - ease;
                }
            }

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
