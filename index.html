<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Jia | Portfolio Entry</title>

    <!-- 提前连接目标网站，减少跳转时的等待 -->
    <link rel="preconnect" href="https://work.timjia.com">
    <link rel="dns-prefetch" href="https://work.timjia.com">
    <link rel="prefetch" href="https://work.timjia.com" as="document">

    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&display=swap" rel="stylesheet">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d0d;
        }

        canvas {
            display: block;
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        
        .overlay {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            text-align: center; 
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.18s ease;
        }

        .enter-link {
            font-family: 'Roboto Mono', monospace; 
            color: rgba(255, 255, 255, 0.5); 
            font-weight: 300; 
            letter-spacing: 0.4em; 
            text-transform: uppercase;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.4s ease;
            display: inline-block;
            animation: breathe 4s infinite ease-in-out; 
            pointer-events: auto; 
        }

        .enter-link:hover {
            color: rgba(255, 255, 255, 1);
            letter-spacing: 0.5em;
            animation-play-state: paused; 
        }

        @keyframes breathe {
            0%, 100% {
                opacity: 0.4;
                transform: scale(0.98);
            }

            50% {
                opacity: 0.7;
                transform: scale(1);
            }
        }

        /*
            白色遮罩层：
            点击后立刻盖住页面，减少跳转到下一个页面时的黑屏闪烁。
        */
        #white-cover {
            position: fixed;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 0.18s ease;
        }

        body.transitioning {
            background-color: white;
        }

        body.transitioning #white-cover {
            opacity: 1;
        }

        body.transitioning .overlay {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="overlay">
        <a href="#" class="enter-link" id="enter-button">
            [ SYSTEM / INQUIRY / SYNTHESIS ]
        </a>
    </div>

    <canvas id="canvas"></canvas>

    <div id="white-cover"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const enterButton = document.getElementById('enter-button');
        
        let tips = []; 
        let mouse = { x: -1000, y: -1000 };
        let isExploding = false; 
        let whiteTransitionProgress = 0; 

        const jumpUrl = 'https://work.timjia.com';

        const MAX_TIPS = 600;
        const EXPLOSION_TIPS = 90;
        const GROWTH_SPEED = 0.8; 
        const FRICTION = 0.98;

        /*
            点击后多久跳转。
            原来是 3000ms，这里改成 220ms。
            如果你还觉得慢，可以改成 150。
        */
        const TRANSITION_DURATION = 220;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            if (!isExploding && tips.length < MAX_TIPS) {
                tips.push(new MyceliumTip(mouse.x, mouse.y, true));
            }
        });

        enterButton.addEventListener('click', (e) => {
            e.preventDefault();

            if (!isExploding) {
                triggerExplosion();
            }
        });

        class MyceliumTip {
            constructor(x, y, active = false, isExplosion = false) {
                this.x = x;
                this.y = y;
                this.prevX = x;
                this.prevY = y;
                this.angle = Math.random() * Math.PI * 2;

                this.velocity = isExplosion
                    ? (20 + Math.random() * 12)
                    : (GROWTH_SPEED + Math.random() * 0.5);

                this.life = isExplosion
                    ? (Math.random() * 60 + 45)
                    : (Math.random() * 400 + 300); 

                this.active = active; 
                this.isExplosion = isExplosion;
                this.age = 0;
            }

            update() {
                if (isExploding && !this.isExplosion) {
                    this.angle += (Math.random() - 0.5) * 0.1;
                    this.velocity *= 0.95; 

                    if (this.velocity < 0.2) {
                        this.velocity = 0.4;
                    }

                } else if (!this.isExplosion) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 350 && dist > 10) {
                        const angleToMouse = Math.atan2(dy, dx);
                        let diff = angleToMouse - this.angle;
                        
                        while (diff < -Math.PI) {
                            diff += Math.PI * 2;
                        }

                        while (diff > Math.PI) {
                            diff -= Math.PI * 2;
                        }

                        this.angle += diff * 0.06;
                        this.velocity *= 1.02; 
                    }
                }

                if (this.isExplosion) {
                    this.angle += (Math.random() - 0.5) * 0.2; 
                } else {
                    this.angle += (Math.random() - 0.5) * 0.25;
                }
                
                this.prevX = this.x;
                this.prevY = this.y;

                this.x += Math.cos(this.angle) * this.velocity;
                this.y += Math.sin(this.angle) * this.velocity;
                
                this.velocity *= FRICTION;

                if (this.velocity < 0.3) {
                    this.velocity = 0.6; 
                }

                this.age++;
                
                if (
                    Math.random() < 0.012 &&
                    tips.length < (MAX_TIPS + EXPLOSION_TIPS) &&
                    this.age < this.life * 0.8
                ) {
                    const newTip = new MyceliumTip(this.x, this.y, true, isExploding);

                    if (!isExploding) {
                        newTip.angle = this.angle + (Math.random() - 0.5) * 0.8;
                    } else {
                        newTip.angle = this.angle + (Math.random() - 0.5) * 1.5; 
                        newTip.velocity = this.velocity * (0.8 + Math.random() * 0.4);
                    }

                    tips.push(newTip);
                }
            }

            draw() {
                const alpha = 1.0 - (this.age / this.life);

                ctx.beginPath();

                if (isExploding) {
                    ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.lineWidth = Math.max(0.1, 2.1 * alpha); 
                } else {
                    ctx.strokeStyle = `rgba(240, 235, 215, ${alpha * 0.35})`;
                    ctx.lineWidth = Math.max(0.1, 1.0 * alpha);
                }

                ctx.moveTo(this.prevX, this.prevY);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();
            }
        }

        function triggerExplosion() {
            isExploding = true;

            document.body.classList.add('transitioning');
            
            const startX = canvas.width / 2;
            const startY = canvas.height / 2;

            for (let i = 0; i < EXPLOSION_TIPS; i++) {
                tips.push(new MyceliumTip(startX, startY, true, true));
            }

            setTimeout(() => {
                window.location.replace(jumpUrl);
            }, TRANSITION_DURATION); 
        }

        function init() {
            for (let i = 0; i < 50; i++) {
                tips.push(
                    new MyceliumTip(
                        Math.random() * canvas.width,
                        Math.random() * canvas.height
                    )
                );
            }
        }

        init();

        function loop() {
            if (isExploding) {
                whiteTransitionProgress += 0.22;

                if (whiteTransitionProgress > 1) {
                    whiteTransitionProgress = 1;
                }
                
                ctx.fillStyle = `rgba(255, 255, 255, ${whiteTransitionProgress})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

            } else {
                ctx.fillStyle = 'rgba(13, 13, 13, 0.006)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            for (let i = tips.length - 1; i >= 0; i--) {
                tips[i].update();
                tips[i].draw();

                if (
                    (!isExploding && tips[i].age > tips[i].life) ||
                    (isExploding && tips[i].age > tips[i].life * 1.1) || 
                    tips[i].x < -100 ||
                    tips[i].x > canvas.width + 100 || 
                    tips[i].y < -100 ||
                    tips[i].y > canvas.height + 100
                ) {
                    tips.splice(i, 1);
                }
            }

            if (!isExploding && tips.length < 60) {
                tips.push(
                    new MyceliumTip(
                        Math.random() * canvas.width,
                        Math.random() * canvas.height
                    )
                );
            }

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
