<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101b18" />
    <script>
      // Set this before the browser restores a previous scroll position.
      history.scrollRestoration = "manual";
      if (["#top", "#simple"].includes(location.hash)) {
        history.replaceState(
          null,
          "",
          location.pathname + location.search + "#globe",
        );
      }
      if (!location.hash || location.hash === "#globe") {
        scrollTo({ top: 0, behavior: "instant" });
      }
    </script>
    <title>Tim Jia — Landscape Designer & Researcher</title>
    <meta
      name="description"
      content="Tianzhen (Tim) Jia’s portfolio of landscape architecture, environmental research, public parks, and learning environments. Harvard GSD MLA and Cornell Environment & Sustainability."
    />
    <meta property="og:title" content="Tim Jia — Landscape design & research" />
    <meta
      property="og:description"
      content="Selected landscape design and research by Tianzhen (Tim) Jia."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
