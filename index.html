<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Jia | Portfolio Entry</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&display=swap" rel="stylesheet">
    <style>
        /* 核心修改：移除所有 transition，确保颜色切换是 0 延迟的瞬间动作 */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0d0d0d; }
        canvas { display: block; }
        
        .overlay {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            text-align: center; 
            z-index: 10;
            cursor: pointer;
        }

        .enter-link {
            font-family: 'Roboto Mono', monospace; 
            color: rgba(255, 255, 255, 0.5); 
            font-weight: 300; 
            letter-spacing: 0.4em; 
            text-transform: uppercase;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-block;
            animation: breathe 4s infinite ease-in-out; 
            pointer-events: auto; 
        }

        .enter-link:hover {
            color: rgba(255, 255, 255, 1);
            letter-spacing: 0.5em;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 0.7; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="overlay">
        <a href="#" class="enter-link" id="enter-button">
            [ SYSTEM / INQUIRY / SYNTHESIS ]
        </a>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const enterButton = document.getElementById('enter-button');
        
        let tips = []; 
        let mouse = { x: -1000, y: -1000 };
        let isExploding = false; 
        const jumpUrl = 'https://work.timjia.com';

        const MAX_TIPS = 600; 
        const EXPLOSION_TIPS = 400; 
        const GROWTH_SPEED = 0.8; 
        const FRICTION = 0.98;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            if (!isExploding && tips.length < MAX_TIPS) {
                tips.push(new MyceliumTip(mouse.x, mouse.y));
            }
        });

        enterButton.addEventListener('click', (e) => {
            e.preventDefault();
            if (!isExploding) triggerExplosion();
        });

        class MyceliumTip {
            constructor(x, y, isExplosion = false) {
                this.x = x;
                this.y = y;
                this.prevX = x;
                this.prevY = y;
                this.angle = Math.random() * Math.PI * 2;
                // 提高烟花爆发的速度感
                this.velocity = isExplosion ? (30 + Math.random() * 20) : (GROWTH_SPEED + Math.random() * 0.5);
                this.life = isExplosion ? 40 : (Math.random() * 400 + 300); 
                this.isExplosion = isExplosion;
                this.age = 0;
            }

            update() {
                this.angle += (Math.random() - 0.5) * 0.3;
                this.prevX = this.x;
                this.prevY = this.y;
                this.x += Math.cos(this.angle) * this.velocity;
                this.y += Math.sin(this.angle) * this.velocity;
                this.velocity *= FRICTION;
                this.age++;
            }

            draw() {
                let alpha = 1.0 - (this.age / this.life);
                ctx.beginPath();
                if (isExploding) {
                    // 烟花颜色改为稍微带一点点灰度，在纯白背景上更有质感
                    ctx.strokeStyle = `rgba(30, 30, 30, ${alpha * 0.8})`; 
                    ctx.lineWidth = 2 * alpha; 
                } else {
                    ctx.strokeStyle = `rgba(240, 235, 215, ${alpha * 0.35})`;
                    ctx.lineWidth = Math.max(0.1, 1.0 * alpha);
                }
                ctx.moveTo(this.prevX, this.prevY);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();
            }
        }

        function triggerExplosion() {
            isExploding = true;
            
            // 1. 彻底消灭黑色闪烁：同时强制 HTML 和 BODY 瞬间转白
            document.documentElement.style.backgroundColor = 'white';
            document.body.style.backgroundColor = 'white';
            enterButton.style.display = 'none'; 

            const startX = canvas.width / 2;
            const startY = canvas.height / 2;

            // 2. 瞬间清空画布为白色，为烟花准备底色
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 3. 注入烟花粒子
            for (let i = 0; i < EXPLOSION_TIPS; i++) {
                tips.push(new MyceliumTip(startX, startY, true));
            }

            // 4. 跳转延迟：150ms。
            // 既能保证烟花“炸开”的画面被眼睛捕捉到，又不会让你感到等待。
            setTimeout(() => {
                window.location.href = jumpUrl;
            }, 150); 
        }

        function loop() {
            if (!isExploding) {
                ctx.fillStyle = 'rgba(13, 13, 13, 0.006)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                // 爆炸时保持背景纯白，不再使用半透明覆盖
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            for (let i = tips.length - 1; i >= 0; i--) {
                tips[i].update();
                tips[i].draw();
                if (tips[i].age > tips[i].life) tips.splice(i, 1);
            }

            if (!isExploding && tips.length < 60) {
                tips.push(new MyceliumTip(Math.random() * canvas.width, Math.random() * canvas.height));
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
